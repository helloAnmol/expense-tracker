<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fa-solid fa-wallet"></i> Expense Tracker</h1>
        </header>

        <!-- Balance Dashboard -->
        <div class="dashboard">
            <div class="card balance">
                <h3>Total Balance</h3>
                <h2 id="balance">$0.00</h2>
            </div>
            <div class="card income">
                <h3><i class="fa-solid fa-arrow-trend-up"></i> Income</h3>
                <h2 id="total-income">+$0.00</h2>
            </div>
            <div class="card expense">
                <h3><i class="fa-solid fa-arrow-trend-down"></i> Expense</h3>
                <h2 id="total-expense">-$0.00</h2>
            </div>
        </div>

        <div class="main-content">
            <!-- Left Column: Form & Chart -->
            <div class="left-panel">
                <form id="transaction-form" class="card">
                    <h3 id="form-title">Add New Transaction</h3>
                    
                    <div class="form-control">
                        <label for="desc">Description</label>
                        <input type="text" id="desc" placeholder="e.g., Groceries, Salary" required>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-control">
                            <label for="amount">Amount</label>
                            <input type="number" id="amount" placeholder="0.00" step="0.01" required>
                        </div>
                        <div class="form-control">
                            <label for="type">Type</label>
                            <select id="type" required>
                                <option value="expense">Expense</option>
                                <option value="income">Income</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-control">
                            <label for="category">Category</label>
                            <select id="category" required>
                                <option value="Housing">Housing</option>
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Salary">Salary</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-control">
                            <label for="date">Date</label>
                            <input type="date" id="date" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn">Add Transaction</button>
                </form>

                <!-- Chart Container -->
                <div class="card chart-container">
                    <h3>Spending by Category</h3>
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>

            <!-- Right Column: Transactions List & Filters -->
            <div class="right-panel">
                <div class="card">
                    <div class="list-header">
                        <h3>Transactions</h3>
                        <!-- Filters -->
                        <div class="filters">
                            <input type="text" id="search" placeholder="🔍 Search...">
                            <input type="month" id="month-filter">
                        </div>
                    </div>
                    
                    <ul id="transaction-list" class="transaction-list">
                        <!-- Transactions will be injected here by JS -->
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
